# CPU 使用率感測（node_exporter）——基本範本（T033）
#
# busy = 1 − idle 佔比（5 分鐘窗口平滑）。天花板恆為 1（100%）。
# 注意：CPU 使用率是波動型資源，ETA 引擎對斜率≈0 自動判「無成長」，
# 解除遲滯（連續 2 輪低於門檻）防抖動。

sensors:
  - id: dev-cpu-busy
    desc: "主機 CPU 使用率（5m 平均）"
    service: infra
    scope: k8s
    metric:
      value:   '1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))'
      ceiling: 'vector(1)'
