# servers.com 月流量配額——容量觸頂感測【正式環境範本】
#
# ⚠️ 本檔預設整份停用（全為註解）：等你有了真實 host_id 與配額值，
#    取消註解並填入後即可啟用。本機測試請改用 local-mock.yaml。
#
# 資料鏈：servers.com API（OpenMetrics）→ Prometheus scrape
#        （見 deploy/prometheus/serverscom-scrape.yml）→ sentinel 本感測
#
# 指標語意：
#   serverscom_host_monthly_sent_bytes_total 為「當月累積送出流量」counter，
#   單調遞增、月初歸零。月初跳變由引擎的採樣有效性校驗自動處理（剔除缺口、
#   Theil–Sen 重算），不需人工介入。
#
# 取消註解即啟用：
# ------------------------------------------------------------------------------
# sensors:
#   - id: serverscom-egress-quota
#     desc: "servers.com 專屬主機月流量配額"
#     metric:
#       value:   'serverscom_host_monthly_sent_bytes_total{traffic_type="public",host_id="YOUR_HOST_ID"}'
#       ceiling: 'serverscom_host_monthly_sent_bytes_total{traffic_type="public",host_id="YOUR_HOST_ID"} * 0 + 50e12'  # 50 TB 配額，改成你的方案值
#     horizons: [6h, 7d]
#     thresholds:
#       warn_eta: 72h
#       crit_eta: 24h
#       soft_ratio: 0.80
# ------------------------------------------------------------------------------
