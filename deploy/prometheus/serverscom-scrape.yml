# servers.com 公開 API 的 Prometheus scrape 作業
# 文件：https://developers.servers.com/api-documentation/v1/#tag/Metrics
#
# 該端點直接回傳 OpenMetrics 文字格式（ListHostsMetrics），Prometheus 可原生抓取：
#   serverscom_hosts_count{...}
#   serverscom_host_monthly_sent_bytes_total{host_id,title,traffic_type,...}     # 月送出流量 counter
#   serverscom_host_monthly_received_bytes_total{host_id,title,traffic_type,...} # 月接收流量 counter
#
# 使用步驟：
#   1. servers.com 帳號 → API Keys 產生 token
#   2. 把此檔併入 prometheus.yml 的 scrape_configs（token 以檔案注入，勿入版控）
#   3. 重載 Prometheus 後，於 /targets 確認 up；指標前綴 serverscom_
#
# 注意：
#   - 有 rate limit（x-ratelimit-* headers）；scrape_interval 5m 足夠——
#     月流量是慢變數，更密只浪費額度
#   - scheme 需 https；API 主機憑證為公開 CA 簽發

scrape_configs:
  - job_name: "serverscom"
    scrape_interval: 5m
    scheme: https
    metrics_path: /v1/metrics/hosts
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/serverscom.token  # 內容僅一行 token
    static_configs:
      - targets: ["api.servers.com"]
