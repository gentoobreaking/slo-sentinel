# 本機測試用 Prometheus 設定（docker-compose dev profile 會掛載此檔）
#
# 抓取：node-exporter（compose 內建服務）——真實主機/VM 指標
# 驗證：http://localhost:9090/targets 應看到 node-exporter up；
#      查詢 node_filesystem_used_bytes 應有資料

global:
  scrape_interval: 30s

scrape_configs:
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: "prometheus-self"
    static_configs:
      - targets: ["localhost:9090"]
