# 本機測試用 Prometheus 設定——抓 mock-exporter，餵 sentinel 容量感測
#
# 啟動：
#   docker run -d --name prom-dev -p 9090:9090 \
#     -v $PWD/deploy/prometheus/prometheus-dev.yml:/etc/prometheus/prometheus.yml \
#     prom/prometheus:latest
#
# 驗證：http://localhost:9090/targets 應看到 mock-exporter up；
#      查詢 serverscom_host_monthly_sent_bytes_total 應見數值遞增

global:
  scrape_interval: 30s   # 演示用：密一點才看得到斜率

scrape_configs:
  - job_name: "mock-cloud"
    static_configs:
      - targets: ["host.docker.internal:9999"]   # cmd/mock-exporter
  - job_name: "prometheus-self"
    static_configs:
      - targets: ["localhost:9090"]
